name: Playwright Tests

on:
  # schedule:
  #   - cron: '30 21 * * 1-3'  # Mon-Fri 8PM IST
  push:
    branches: [master]
  # pull_request:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'QA'
        type: choice
        options:
          - QA
          - stage
          - dev

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'QA' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (if cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # reportingLabs run history: powers the Trend chart, new vs known
      # failures, flaky dots and "got slower". One history per environment.
      - name: Restore reportingLabs history
        uses: actions/cache@v4
        with:
          path: reporting-labs.history.json
          key: reporting-labs-history-${{ github.event.inputs.environment || 'QA' }}-${{ github.run_id }}
          restore-keys: reporting-labs-history-${{ github.event.inputs.environment || 'QA' }}-

      - name: Run tests
        run: npx playwright test --project=chromium
        env:
          ENV: ${{ github.event.inputs.environment || 'QA' }}
          BASEURL: ${{ secrets.BASEURL }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          # OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          # OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          # GRANT_TYPE: ${{ secrets.GRANT_TYPE }}

      - name: Add test results to run summary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const reportPath = 'reports/playwright-results.json';
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;

          if (!fs.existsSync(reportPath)) {
            fs.appendFileSync(summaryPath, '## Playwright test results\n\nNo test report was generated; the test run may have failed before Playwright completed.\n');
            process.exit(0);
          }

          const { stats } = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const passed = stats.expected + stats.flaky;
          const total = passed + stats.unexpected + stats.skipped;

          fs.appendFileSync(
            summaryPath,
            `## Playwright test results\n\n| Result | Count |\n| --- | ---: |\n| Passed${stats.flaky ? ' (includes flaky)' : ''} | ${passed} |\n| Failed | ${stats.unexpected} |\n| Skipped | ${stats.skipped} |\n| Total | ${total} |\n\nFlaky tests: ${stats.flaky}\n`
          );
          NODE

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ github.run_id }}
          path: reports/html-report/
          retention-days: 30

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}
          path: allure-results/
          retention-days: 30

      - name: Upload reportingLabs Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporting-labs-report-${{ github.run_id }}
          path: reporting-labs/
          retention-days: 30