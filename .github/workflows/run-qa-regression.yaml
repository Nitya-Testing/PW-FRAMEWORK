
name: Playwright QA Tests

on:
  workflow_dispatch:

jobs:
  test:
    name: Run Playwright Tests - QA
    runs-on: ubuntu-latest
    environment: QA

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: Nitya-Testing/PW-FRAMEWORK

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: npx playwright test --project=chromium
        env:
          ENV: qa
          TEST_ENV: qa
          BASEURL: ${{ secrets.BASEURL }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}

      # Upload Playwright HTML report
      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-playwright-html-report
          path: reports/html-report/
          retention-days: 30

      # Upload Allure raw results
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-allure-results
          path: allure-results/
          retention-days: 30

      # Generate Allure report
      - name: Install Allure
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d "allure-results" ] && [ "$(ls -A allure-results)" ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "No Allure results found."
          fi

      # Upload generated Allure report
      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-allure-report
          path: allure-report/
          retention-days: 30

      # # Upload reportingLabs report
      # - name: Upload reportingLabs Report
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: qa-reporting-labs-report
      #     path: reporting-labs/
      #     retention-days: 30

  publish-reports:
    name: Publish QA Reports to GitHub Pages
    needs: test
    if: always()
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: gh-pages
      cancel-in-progress: false

    env:
      RUN_DIR: pages-deploy/runs/${{ github.run_id }}
      REPORT_URL: https://github.com/Nitya-Testing/PW-FRAMEWORK/runs/${{ github.run_id }}

    steps:
      - name: Download QA Reports
        uses: actions/download-artifact@v4
        with:
          path: qa-reports

      - name: Organize Reports
        run: |
          mkdir -p "$RUN_DIR"

          cp -r qa-reports/qa-playwright-html-report "$RUN_DIR/html" 2>/dev/null || true
          cp -r qa-reports/qa-allure-report "$RUN_DIR/allure" 2>/dev/null || true
          cp -r qa-reports/qa-reporting-labs-report "$RUN_DIR/rlabs" 2>/dev/null || true

          echo "Reports organized:"
          ls -la "$RUN_DIR"

      - name: Create Landing Page
        run: |
          cat > "$RUN_DIR/index.html" <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>QA Playwright Report</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 32px 16px;
                background: #f5f6f8;
                color: #1d2433;
              }
              .container {
                max-width: 720px;
                margin: 0 auto;
              }
              .card {
                background: white;
                border-radius: 12px;
                padding: 24px;
              }
              a {
                display: inline-block;
                margin: 8px;
                padding: 12px 18px;
                border-radius: 8px;
                color: white;
                text-decoration: none;
                background: #2563eb;
              }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>QA Playwright Test Report</h1>
              <p>Run ID: ${{ github.run_id }}</p>
              <div class="card">
                <a href="html/index.html">Playwright HTML</a>
                <a href="allure/index.html">Allure Report</a>
                <a href="rlabs/index.html">ReportingLabs</a>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-deploy
          keep_files: true

      - name: Report Links
        run: |
          {
            echo "### QA Test Reports"
            echo ""
            echo "- [All Reports]($REPORT_URL/index.html)"
            echo "- [Playwright HTML]($REPORT_URL/html/index.html)"
            echo "- [Allure]($REPORT_URL/allure/index.html)"
            echo "- [ReportingLabs]($REPORT_URL/rlabs/index.html)"
          } >> "$GITHUB_STEP_SUMMARY"